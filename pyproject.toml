[project]
name = "climate-tech-venture-screening-diligence-toolkit"
version = "0.1.0"
description = "A synthetic-data toolkit modeling the analytical workflow of an early-stage climate tech VC analyst: deal screening, unit-economics/technology cost-curve modeling, fund-return modeling, and diligence tracking with IC memo generation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
addopts = "--cov=screening --cov=unit_economics --cov=fund_returns --cov=diligence --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
